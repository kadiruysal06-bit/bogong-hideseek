<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ada">
<title>Ada'nın Oyun Dünyası 🐱</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#AEE7FF; --pink:#FF8FB1; --sun:#FFD75E; --mint:#7FE8C3;
  --plum:#5B3FA8; --cream:#FFF8EC; --orange:#FFA75E;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Fredoka',sans-serif;
  background:linear-gradient(180deg,var(--sky) 0%,#DFF6FF 55%,var(--mint) 100%);
  color:var(--plum);
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;
  position:fixed;inset:0;width:100%;
  overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{touch-action:manipulation;}
.scene{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;}
.scene.active{display:flex;}

/* ---------- Clouds ---------- */
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.8;animation:drift linear infinite;}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%;}
.cloud.c1{width:90px;height:32px;top:8%;animation-duration:38s;}
.cloud.c1::before{width:40px;height:40px;top:-18px;left:14px;}
.cloud.c1::after{width:28px;height:28px;top:-12px;left:48px;}
.cloud.c2{width:120px;height:38px;top:20%;animation-duration:55s;animation-delay:-20s;}
.cloud.c2::before{width:52px;height:52px;top:-24px;left:18px;}
.cloud.c2::after{width:36px;height:36px;top:-16px;left:62px;}
@keyframes drift{from{left:-160px}to{left:110%}}
@media (prefers-reduced-motion: reduce){.cloud{animation:none;left:10%;}}

/* ---------- Kitten character ---------- */
.kitten{position:relative;width:120px;height:110px;display:inline-block;}
.kitten .head{position:absolute;bottom:0;left:10px;width:100px;height:88px;background:var(--orange);border-radius:48% 48% 46% 46%;box-shadow:inset 0 -8px 0 rgba(0,0,0,.06);}
.kitten .ear{position:absolute;top:-16px;width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-bottom:34px solid var(--orange);}
.kitten .ear.l{left:6px;transform:rotate(-14deg);}
.kitten .ear.r{right:6px;transform:rotate(14deg);}
.kitten .ear::after{content:'';position:absolute;left:-10px;top:12px;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:18px solid var(--pink);}
.kitten .eye{position:absolute;top:32px;width:16px;height:18px;background:#2E2440;border-radius:50%;animation:blink 4s infinite;}
.kitten .eye::after{content:'';position:absolute;top:3px;left:3px;width:6px;height:6px;background:#fff;border-radius:50%;}
.kitten .eye.l{left:22px;} .kitten .eye.r{right:22px;}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.kitten .nose{position:absolute;top:52px;left:50%;transform:translateX(-50%);width:14px;height:10px;background:var(--pink);border-radius:40% 40% 60% 60%;}
.kitten .mouth{position:absolute;top:62px;left:50%;transform:translateX(-50%);width:26px;height:12px;border:3px solid #2E2440;border-top:none;border-radius:0 0 20px 20px;}
.kitten .whisker{position:absolute;top:54px;width:26px;height:2px;background:#2E2440;border-radius:2px;}
.kitten .whisker.w1{left:-14px;transform:rotate(8deg);}
.kitten .whisker.w2{left:-14px;top:62px;transform:rotate(-6deg);}
.kitten .whisker.w3{right:-14px;transform:rotate(-8deg);}
.kitten .whisker.w4{right:-14px;top:62px;transform:rotate(6deg);}
.kitten.bounce{animation:kbounce 1.6s ease-in-out infinite;}
@keyframes kbounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion: reduce){.kitten.bounce{animation:none;}}
.kitten.gray .head,.kitten.gray .ear{background:#B9C4D6;border-bottom-color:#B9C4D6;}
.kitten.gray .ear{border-bottom-color:#B9C4D6;}
.kitten.mini{transform:scale(.5);transform-origin:bottom center;}

/* ---------- Buttons ---------- */
.big-btn{
  font-family:inherit;font-weight:700;border:none;cursor:pointer;
  background:var(--sun);color:var(--plum);
  border-radius:32px;padding:20px 44px;font-size:2rem;
  box-shadow:0 8px 0 #E0AF2E;transition:transform .1s;
}
.big-btn:active{transform:translateY(6px);box-shadow:0 2px 0 #E0AF2E;}
.icon-btn{
  position:absolute;top:14px;width:64px;height:64px;border-radius:50%;
  border:none;font-size:2rem;cursor:pointer;background:#fff;
  box-shadow:0 5px 0 rgba(91,63,168,.25);z-index:20;
}
.icon-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(91,63,168,.25);}
#homeBtn{left:14px;} #repeatBtn{right:14px;background:var(--pink);}

.menu-cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:24px;}
.card{
  width:170px;height:190px;border-radius:28px;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  font-family:inherit;font-weight:600;font-size:1.15rem;color:var(--plum);
  transition:transform .12s;
}
.card:active{transform:scale(.94);}
.card .emo{font-size:3.4rem;}
.card.c-hide{background:var(--sun);box-shadow:0 8px 0 #E0AF2E;}
.card.c-letters{background:var(--pink);box-shadow:0 8px 0 #E06A90;}
.card.c-race{background:var(--mint);box-shadow:0 8px 0 #4FC79C;}
.card.c-maze{background:#C9B6FF;box-shadow:0 8px 0 #9B7FE8;}
.card.c-sling{background:#FFB3A1;box-shadow:0 8px 0 #E58767;}

h1.title{font-size:clamp(2rem,7vw,3.2rem);font-weight:700;text-shadow:0 3px 0 #fff;}
.subtitle{font-size:1.2rem;opacity:.85;margin-top:6px;}

/* Stars progress */
.stars{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:1.9rem;letter-spacing:4px;z-index:15;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12));}

/* ---------- Hide & Seek ---------- */
.hide-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6vmin;margin-top:8px;}
.spot{position:relative;font-size:clamp(3.4rem,12vmin,6rem);background:none;border:none;cursor:pointer;transition:transform .12s;line-height:1.1;}
.spot:active{transform:scale(.9);}
.spot.shake{animation:shake .45s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px) rotate(-5deg)}75%{transform:translateX(10px) rotate(5deg)}}
.spot .peek{position:absolute;left:50%;bottom:78%;transform:translateX(-50%) scale(.55);transform-origin:bottom center;opacity:0;pointer-events:none;transition:opacity .2s;}
.spot.found .peek{opacity:1;animation:popup .5s ease-out;}
@keyframes popup{0%{transform:translateX(-50%) scale(0)}70%{transform:translateX(-50%) scale(.65)}100%{transform:translateX(-50%) scale(.55)}}
.soundwave{position:absolute;top:-8px;right:-8px;font-size:1.6rem;opacity:0;}
.soundwave.on{opacity:1;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}

/* ---------- Letter balloons ---------- */
.balloons{display:flex;gap:5vmin;flex-wrap:wrap;justify-content:center;margin-top:10px;}
.balloon{
  position:relative;width:clamp(90px,22vmin,130px);height:clamp(110px,27vmin,160px);
  border-radius:50% 50% 48% 48%;border:none;cursor:pointer;
  font-family:inherit;font-weight:700;font-size:clamp(2.6rem,9vmin,4rem);color:#fff;
  text-shadow:0 3px 0 rgba(0,0,0,.18);
  animation:floaty 3s ease-in-out infinite;
  transition:transform .15s;
}
.balloon::after{content:'';position:absolute;bottom:-26px;left:50%;width:2px;height:26px;background:rgba(91,63,168,.5);}
.balloon:nth-child(2){animation-delay:-.8s}
.balloon:nth-child(3){animation-delay:-1.6s}
.balloon:nth-child(4){animation-delay:-2.4s}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@media (prefers-reduced-motion: reduce){.balloon{animation:none;}}
.balloon.pop{animation:popballoon .35s forwards;}
@keyframes popballoon{to{transform:scale(1.6);opacity:0}}
.balloon.wrong{animation:shake .45s;}

/* ---------- Race ---------- */
.track{position:relative;width:min(92vw,640px);height:150px;background:#fff;border-radius:24px;box-shadow:0 6px 0 rgba(91,63,168,.15);overflow:hidden;margin-bottom:10px;}
.lane{position:absolute;left:0;right:0;height:50%;}
.lane.top{top:0;border-bottom:3px dashed var(--sky);}
.lane.bottom{bottom:0;}
.finish{position:absolute;right:10px;top:6px;bottom:6px;width:14px;background:repeating-linear-gradient(45deg,#2E2440 0 8px,#fff 8px 16px);border-radius:6px;}
.runner{position:absolute;bottom:2px;left:0;transition:left .6s cubic-bezier(.34,1.56,.64,1);}
.fish-box{font-size:clamp(2.4rem,9vmin,3.6rem);background:#fff;border-radius:24px;padding:14px 22px;box-shadow:0 6px 0 rgba(91,63,168,.15);max-width:92vw;line-height:1.3;}
.num-row{display:flex;gap:5vmin;margin-top:20px;}
.num-btn{
  width:clamp(84px,20vmin,110px);height:clamp(84px,20vmin,110px);border-radius:50%;border:none;cursor:pointer;
  font-family:inherit;font-weight:700;font-size:clamp(2.4rem,8vmin,3.4rem);color:var(--plum);
  background:var(--sun);box-shadow:0 7px 0 #E0AF2E;transition:transform .1s;
}
.num-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #E0AF2E;}
.num-btn.wrong{animation:shake .45s;background:#eee;box-shadow:0 7px 0 #ccc;}
.rlane{position:relative;height:62px;border-bottom:3px dashed var(--sky);}
.rlane:last-of-type{border-bottom:none;}
.rlane .runner{position:absolute;bottom:2px;left:0;transition:left .35s linear;}
.kitten.rv0{filter:grayscale(.85);}
.kitten.rv1{filter:hue-rotate(150deg);}
.kitten.rv2{filter:hue-rotate(-100deg) saturate(1.2);}

/* ---------- Pati Sapanı ---------- */
#scene-sling{padding:0;}
#swrap{position:absolute;inset:0;overflow:hidden;touch-action:none;}
#scontainer{position:absolute;top:50%;left:50%;width:1000px;height:625px;transform-origin:center center;}
#scontainer canvas{width:1000px;height:625px;border-radius:18px;}

/* ---------- Miyav-Man ---------- */
#scene-pac{padding:0;}
#pwrap{position:absolute;inset:0;overflow:hidden;touch-action:none;}
#pcontainer{position:absolute;top:50%;left:50%;width:800px;height:1000px;transform-origin:center center;}
#pcontainer canvas{width:800px;height:1000px;border-radius:18px;}
.card.c-pac{background:#8FD9E8;box-shadow:0 8px 0 #5FB4C6;}
.card.c-paint{background:#FFDFBA;box-shadow:0 8px 0 #E5B285;}
.card.c-puzzle{background:#FFC9F0;box-shadow:0 8px 0 #E29AD4;}

/* ---------- Unicorn Yapboz ---------- */
#scene-puzzle{padding:0;}
#zwrap{position:absolute;inset:0;overflow:hidden;touch-action:none;}
#zcontainer{position:absolute;top:50%;left:50%;width:800px;height:1000px;transform-origin:center center;}
#zcontainer canvas{width:800px;height:1000px;border-radius:18px;}

/* ---------- Boyama Tahtası ---------- */
#scene-paint{padding:0;flex-direction:column;justify-content:flex-start;}
#paintbar-top{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:12px 92px 6px;width:100%;z-index:5;}
#paintbar-bottom{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 10px 14px;width:100%;z-index:5;}
#pwrap2{position:relative;flex:1;width:100%;overflow:hidden;touch-action:none;min-height:0;}
#pcontainer2{position:absolute;top:50%;left:50%;width:1000px;height:700px;transform-origin:center center;}
#pcontainer2 canvas{width:1000px;height:700px;border-radius:20px;}
.ptab{font-family:inherit;font-weight:700;font-size:1.1rem;color:var(--plum);background:#fff;border:none;border-radius:20px;padding:12px 20px;box-shadow:0 4px 0 rgba(91,63,168,.25);cursor:pointer;}
.ptab.sel{background:var(--sun);box-shadow:0 4px 0 #E0AF2E;}
.ptool{height:52px;min-width:52px;border-radius:16px;font-size:1.4rem;background:#fff;border:none;box-shadow:0 4px 0 rgba(91,63,168,.25);cursor:pointer;}
.ptool:active,.ptab:active{transform:translateY(3px);}
.pswatch{width:50px;height:50px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 rgba(91,63,168,.3);cursor:pointer;flex:none;}
.pswatch.sel{border-color:var(--plum);transform:scale(1.18);}
.pswatch.eraser{background:#fff linear-gradient(135deg,#fff 45%,#FF8FB1 45%,#FF8FB1 60%,#fff 60%);}
.psize{width:50px;height:50px;border-radius:50%;background:#fff;border:none;box-shadow:0 3px 0 rgba(91,63,168,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;}
.psize.sel{outline:4px solid var(--plum);}
.psize i{display:block;border-radius:50%;background:var(--plum);}
@media (orientation:landscape) and (max-height:900px){
  .pswatch{width:42px;height:42px;}
  .psize{width:42px;height:42px;}
  .ptool{height:44px;min-width:44px;}
  .ptab{padding:9px 16px;font-size:1rem;}
}

/* ---------- Confetti ---------- */
.confetti{position:fixed;top:-20px;width:12px;height:12px;border-radius:3px;pointer-events:none;z-index:99;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}

/* ---------- iPad landscape: keep everything on one screen ---------- */
@media (orientation: landscape) and (max-height: 900px){
  .card{width:200px;height:170px;}
  .card .emo{font-size:3rem;}
  .kitten{transform:scale(.85);transform-origin:bottom center;}
  .hide-grid{gap:4vmin;margin-top:4px;}
  .spot{font-size:clamp(3rem,11vmin,5.2rem);}
  .balloons{gap:4vmin;}
  .track{height:130px;}
  .fish-box{padding:10px 18px;}
  .num-row{margin-top:12px;}
  .stars{top:16px;}
}
@media (orientation: landscape) and (max-height: 600px){
  h1.title{font-size:clamp(1.3rem,4vh,1.8rem);}
  .kitten{display:none;}
  .card{width:180px;height:140px;}
}

/* ---------- Win overlay ---------- */
/* ---------- Kaç Kaç Bahçesi (maze) ---------- */
#scene-maze{padding:0;}
#mwrap{position:absolute;inset:0;overflow:hidden;touch-action:none;}
#mcontainer{position:absolute;top:50%;left:50%;width:800px;height:1000px;transform-origin:center center;}
#mcontainer canvas{position:absolute;top:0;left:0;width:800px;height:1000px;border-radius:18px;}
#mjbase,#mjthumb{position:absolute;border-radius:50%;display:none;pointer-events:none;transform:translate(-50%,-50%);z-index:16;}
#mjbase{width:130px;height:130px;background:rgba(91,63,168,.08);border:3px solid rgba(91,63,168,.28);}
#mjthumb{width:60px;height:60px;background:rgba(91,63,168,.4);border:3px solid rgba(91,63,168,.65);}
#mpause{position:absolute;top:14px;right:92px;width:64px;height:64px;border-radius:50%;border:none;font-size:1.7rem;cursor:pointer;background:#fff;color:var(--plum);box-shadow:0 5px 0 rgba(91,63,168,.25);z-index:20;display:none;}
#mpause:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(91,63,168,.25);}

#winOverlay{position:fixed;inset:0;background:rgba(255,248,236,.94);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;text-align:center;padding:20px;}
#winOverlay.show{display:flex;}
#winOverlay h2{font-size:clamp(2rem,7vw,3rem);margin:16px 0;}
.trophy{font-size:5rem;animation:kbounce 1.2s infinite;}
</style>
</head>
<body>

<div class="cloud c1"></div>
<div class="cloud c2"></div>

<!-- START -->
<div class="scene active" id="scene-start">
  <div class="kitten bounce">
    <div class="ear l"></div><div class="ear r"></div>
    <div class="head">
      <div class="eye l"></div><div class="eye r"></div>
      <div class="nose"></div><div class="mouth"></div>
      <div class="whisker w1"></div><div class="whisker w2"></div>
      <div class="whisker w3"></div><div class="whisker w4"></div>
    </div>
  </div>
  <h1 class="title">Ada'nın Oyun Dünyası</h1>
  <p class="subtitle">🐾 Başlamak için patiye dokun! 🐾</p>
  <br>
  <button class="big-btn" id="startBtn">🐾 BAŞLA</button>
</div>

<!-- MENU -->
<div class="scene" id="scene-menu">
  <h1 class="title">Hangi oyunu oynayalım?</h1>
  <div class="menu-cards">
    <button class="card c-hide" data-game="hide"><span class="emo">🙈🐱</span>Saklambaç</button>
    <button class="card c-letters" data-game="letters"><span class="emo">🎈🔤</span>Harf Avı</button>
    <button class="card c-race" data-game="race"><span class="emo">🏁🐟</span>Miyav Yarışı</button>
    <button class="card c-maze" data-game="maze"><span class="emo">🌳🐶</span>Kaç Kaç Bahçesi</button>
    <button class="card c-sling" data-game="sling"><span class="emo">🎯🧶</span>Pati Sapanı</button>
    <button class="card c-pac" data-game="pac"><span class="emo">👻🐱</span>Miyav-Man</button>
    <button class="card c-paint" data-game="paint"><span class="emo">🎨🖍</span>Boyama Tahtası</button>
    <button class="card c-puzzle" data-game="puzzle"><span class="emo">🦄🧩</span>Unicorn Yapboz</button>
  </div>
</div>

<!-- HIDE & SEEK -->
<div class="scene" id="scene-hide">
  <div class="stars" id="hideStars"></div>
  <h1 class="title" style="font-size:clamp(1.4rem,5vw,2.2rem);">Pamuk nereye saklandı? 👀</h1>
  <div class="hide-grid" id="hideGrid"></div>
</div>

<!-- LETTERS -->
<div class="scene" id="scene-letters">
  <div class="stars" id="letterStars"></div>
  <h1 class="title" id="letterPrompt" style="font-size:clamp(1.6rem,6vw,2.6rem);"></h1>
  <div class="balloons" id="balloonRow"></div>
</div>

<!-- RACE -->
<div class="scene" id="scene-race">
  <div class="stars" id="raceLvlLabel" style="font-size:1.3rem;font-weight:700;color:var(--plum);"></div>
  <div class="track" id="raceTrack" style="height:auto;"></div>
  <div class="fish-box" id="fishBox"></div>
  <div class="num-row" id="numRow"></div>
</div>

<!-- SLING: PATİ SAPANI -->
<div class="scene" id="scene-sling">
  <div id="swrap">
    <div id="scontainer"><canvas id="scv" width="1000" height="625"></canvas></div>
  </div>
</div>

<!-- PAC: MİYAV-MAN -->
<div class="scene" id="scene-pac">
  <div id="pwrap">
    <div id="pcontainer"><canvas id="pcv" width="800" height="1000"></canvas></div>
  </div>
</div>

<!-- PUZZLE: UNICORN YAPBOZ -->
<div class="scene" id="scene-puzzle">
  <div id="zwrap">
    <div id="zcontainer"><canvas id="zcv" width="800" height="1000"></canvas></div>
  </div>
</div>

<!-- PAINT: BOYAMA TAHTASI -->
<div class="scene" id="scene-paint">
  <div id="paintbar-top">
    <button class="ptab sel" data-pmode="free">🖍 Boyama</button>
    <button class="ptab" data-pmode="word">🔤 Kelime Avı</button>
    <button class="ptool" id="pnext" style="display:none;">➡️</button>
    <button class="ptool" id="pprint">🖨️</button>
    <button class="ptool" id="pclear">🗑️</button>
  </div>
  <div id="pwrap2">
    <div id="pcontainer2"><canvas id="paintcv" width="1000" height="700"></canvas></div>
  </div>
  <div id="paintbar-bottom"></div>
</div>

<!-- MAZE: KAÇ KAÇ BAHÇESİ -->
<div class="scene" id="scene-maze">
  <div id="mwrap">
    <div id="mcontainer">
      <canvas id="mgc" width="800" height="1000"></canvas>
      <canvas id="muc" width="800" height="1000"></canvas>
    </div>
    <div id="mjbase"></div>
    <div id="mjthumb"></div>
    <button id="mpause">⏸</button>
  </div>
</div>

<!-- WIN OVERLAY -->
<div id="winOverlay">
  <div class="trophy" id="winEmoji">🏆</div>
  <h2 id="winText">Harikasın!</h2>
  <button class="big-btn" id="winHomeBtn">🏠 Oyunlara Dön</button>
</div>

<button class="icon-btn" id="homeBtn" style="display:none;">🏠</button>
<button class="icon-btn" id="repeatBtn" style="display:none;">🔊</button>

<script>
/* ================= AUDIO ================= */
let actx=null;
function audio(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended')actx.resume(); return actx; }
function tone(freq,dur,type='sine',vol=.25,when=0,glide=null){
  const a=audio(),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,a.currentTime+when);
  if(glide)o.frequency.exponentialRampToValueAtTime(glide,a.currentTime+when+dur);
  g.gain.setValueAtTime(vol,a.currentTime+when);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+when+dur);
  o.connect(g);g.connect(a.destination);
  o.start(a.currentTime+when);o.stop(a.currentTime+when+dur+.05);
}

let active=false,raf=null,lastTs=0,tGlobal=0;
let lvl=1,shots=0,balloons=[],obs=[],windX=0,state='aim'; // aim | drag | fly | done

let dragP=null,trail=[],praise=0;
let rainMode=false,rainT=0,rainScore=0,rainSpawnT=0;

function loadLevel(n){
  lvl=n;rainMode=false;
  const L=LVLS[n-1];
  shots=L.shots;
  balloons=L.balloons.map((b,i)=>({...b,color:BCOLORS[i%BCOLORS.length],popped:false,phase:Math.random()*6}));

function resetShot(){
  state='aim';ball={x:ANCHOR.x,y:ANCHOR.y,vx:0,vy:0};dragP=null;trail=[];
  if(rainMode){windX=0;return;}
  const L=LVLS[lvl-1];
  if(L.wind){
    const old=windX;
    windX=(Math.random()<.5?-1:1)*(60+Math.random()*110);
    if(Math.sign(old)!==Math.sign(windX))say(windX>0?'Rüzgar sağa esiyor!':'Rüzgar sola esiyor!');
  }else windX=0;

function bY(b){return b.y+(b.amp?Math.sin(tGlobal*(b.sp||1)+b.phase)*b.amp:0);}
function bX(b){return b.x+(b.hamp?Math.sin(tGlobal*(b.hsp||1)+b.phase)*b.hamp:0);}
function oY(o){return o.y+(o.amp?Math.sin(tGlobal*(o.sp||1)+o.phase)*o.amp:0);}
function bounceObs(o){
  const oy=oY(o);
  const cx=Math.max(o.x,Math.min(ball.x,o.x+o.w));
  const cy=Math.max(oy,Math.min(ball.y,oy+o.h));
  const dx=ball.x-cx,dy=ball.y-cy;
  if(dx*dx+dy*dy>=BALL_R*BALL_R)return false;
  if(Math.abs(dx)>Math.abs(dy)){
    ball.x+=(dx>=0?1:-1)*(BALL_R-Math.abs(dx));
    ball.vx*=-0.45;ball.vy*=0.85;
  }else{
    ball.y+=(dy>=0?1:-1)*(BALL_R-Math.abs(dy));
    ball.vy*=-0.45;ball.vx*=0.85;
  }
  tone(o.cloud?900:240,.08,o.cloud?'sine':'square',.18,0,o.cloud?600:160);
  return true;
}

  ball.x=p.x;ball.y=p.y;

  state='fly';trail=[];
  tone(300,.25,'triangle',.25,0,700);

  if(rec){save.rainBest=rainScore;store();}
  say('Süre bitti! Tam '+rainScore+' balon patlattın Ada!'+(rec?' Yeni rekor! İnanılmazsın!':' Rekorun '+(save.rainBest||0)+'. Bir daha dene, geçebilirsin!'));
  setTimeout(()=>{if(active&&rainMode)loadRain();},6000);
}
function update(dt){
  tGlobal+=dt;
  if(rainMode&&rainT>0){
    rainT-=dt;
    if(rainT<=0){finishRain();}
    else{
      rainSpawnT-=dt;
      if(rainSpawnT<=0&&balloons.filter(b=>!b.popped).length<7){
        rainSpawnT=0.75+Math.random()*0.6;
        balloons.push({
          x:430+Math.random()*520, y:GROUND+60, r:28+Math.random()*20,
          rise:45+Math.random()*55,
          hamp:Math.random()<.5?20+Math.random()*40:0, hsp:1+Math.random()*1.4,
          color:BCOLORS[(Math.random()*BCOLORS.length)|0],
          popped:false, phase:Math.random()*6
        });
      }
      balloons.forEach(b=>{if(!b.popped)b.y-=b.rise*dt;});
      balloons=balloons.filter(b=>!b.popped&&b.y>-80);
    }
  }
  if(state==='fly'){
    ball.vx+=windX*dt;
    ball.vy+=GRAV*dt;
    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    for(const o of obs)bounceObs(o);
    trail.push({x:ball.x,y:ball.y,age:0});
    if(trail.length>16)trail.shift();
    for(const b of balloons){
      if(b.popped)continue;
      if(Math.hypot(ball.x-bX(b),ball.y-bY(b))<b.r+BALL_R+8)popBalloon(b);
    }
    if(ball.y>GROUND-BALL_R){ // yere çarptı, küçük sekme
      ball.y=GROUND-BALL_R;
      if(Math.abs(ball.vy)>140){ball.vy*=-0.35;ball.vx*=0.6;}
      else{setTimeout(endShot,350);state='landing';}
    }
    if(ball.x>SW+80||ball.x<-80){state='landing';setTimeout(endShot,250);}
  }
  trail.forEach(t=>t.age+=dt);
}
/* ---- Çizim ---- */
function draw(){
  const c=sctx;
  // gökyüzü
  const sky=c.createLinearGradient(0,0,0,SH);
  sky.addColorStop(0,'#AEE7FF');sky.addColorStop(.75,'#DFF6FF');sky.addColorStop(1,'#BDE8A0');
  c.fillStyle=sky;c.fillRect(0,0,SW,SH);

  c.fillStyle='#8AC96A';
  for(let x=0;x<SW;x+=46){c.beginPath();c.arc(x+20,GROUND,8,Math.PI,0);c.fill();}

  for(const b of balloons){
    if(b.popped)continue;
    const x=bX(b),y=bY(b);
    c.strokeStyle='rgba(91,63,168,.35)';c.lineWidth=2;
    c.beginPath();c.moveTo(x,y+b.r);
    if(rainMode)c.quadraticCurveTo(x+8,y+b.r+22,x+2,y+b.r+42);
    else c.quadraticCurveTo(x+6,y+b.r+30,b.x,GROUND);
    c.stroke();
    c.fillStyle=b.color;
    c.beginPath();c.ellipse(x,y,b.r*.86,b.r,0,0,Math.PI*2);c.fill();
    c.fillStyle='rgba(255,255,255,.55)';
    c.beginPath();c.ellipse(x-b.r*.3,y-b.r*.35,b.r*.2,b.r*.3,-.4,0,Math.PI*2);c.fill();
    c.fillStyle=b.color;
    c.beginPath();c.moveTo(x-6,y+b.r-2);c.lineTo(x+6,y+b.r-2);c.lineTo(x,y+b.r+9);c.closePath();c.fill();
  }
  // engeller
  for(const o of obs){
    const oy=oY(o);
    if(o.cloud){
      c.fillStyle='rgba(255,255,255,.95)';
      const cx=o.x+o.w/2,cy=oy+o.h/2;
      c.beginPath();c.ellipse(cx,cy,o.w/2,o.h/2,0,0,Math.PI*2);c.fill();
      c.beginPath();c.arc(cx-o.w*.28,cy-4,o.h*.42,0,Math.PI*2);c.fill();
      c.beginPath();c.arc(cx+o.w*.28,cy-2,o.h*.38,0,Math.PI*2);c.fill();
    }else{
      c.fillStyle='#B07A4A';
      c.fillRect(o.x,oy,o.w,o.h);
      c.fillStyle='#8B5A38';
      c.fillRect(o.x,oy,o.w,5);
      c.strokeStyle='rgba(139,90,56,.6)';c.lineWidth=2;
      if(o.h>o.w){for(let y2=oy+22;y2<oy+o.h-8;y2+=26){c.beginPath();c.moveTo(o.x+4,y2);c.lineTo(o.x+o.w-4,y2);c.stroke();}}
      else{for(let x2=o.x+24;x2<o.x+o.w-8;x2+=30){c.beginPath();c.moveTo(x2,oy+4);c.lineTo(x2,oy+o.h-4);c.stroke();}}
    }
  }
  // rüzgar göstergesi
  if(windX!==0){
    const cx=SW/2,cy=118,len=Math.min(70,Math.abs(windX)*.4),s=Math.sign(windX);
    c.fillStyle='rgba(91,63,168,.75)';
    c.font='26px sans-serif';c.textAlign='center';
    c.fillText('💨',cx-s*(len+26),cy+8);
    c.strokeStyle='rgba(91,63,168,.75)';c.lineWidth=6;c.lineCap='round';
    c.beginPath();c.moveTo(cx-s*len,cy);c.lineTo(cx+s*len,cy);c.stroke();
    c.beginPath();c.moveTo(cx+s*len,cy);c.lineTo(cx+s*(len-16),cy-11);c.moveTo(cx+s*len,cy);c.lineTo(cx+s*(len-16),cy+11);c.stroke();
    c.textAlign='left';
  }
  // sapan (arka çatal)
  c.strokeStyle='#8B5A38';c.lineWidth=13;c.lineCap='round';
  c.beginPath();c.moveTo(ANCHOR.x,GROUND);c.lineTo(ANCHOR.x,ANCHOR.y+45);c.stroke();
  c.beginPath();c.moveTo(ANCHOR.x,ANCHOR.y+45);c.lineTo(ANCHOR.x-32,ANCHOR.y-28);c.stroke();
  c.beginPath();c.moveTo(ANCHOR.x,ANCHOR.y+45);c.lineTo(ANCHOR.x+32,ANCHOR.y-28);c.stroke();
  // lastik
  const bp=(state==='drag'&&dragP)?dragP:(state==='aim'?ANCHOR:null);
  if(bp){
    c.strokeStyle='#5B3FA8';c.lineWidth=5;
    c.beginPath();c.moveTo(ANCHOR.x-30,ANCHOR.y-24);c.lineTo(bp.x,bp.y);c.stroke();
    c.beginPath();c.moveTo(ANCHOR.x+30,ANCHOR.y-24);c.lineTo(bp.x,bp.y);c.stroke();
  }
  // hedef çizgisi (sürüklerken — rüzgar dahil)
  if(state==='drag'&&dragP){
    let px=dragP.x,py=dragP.y;
    let vx=(ANCHOR.x-dragP.x)*K,vy=(ANCHOR.y-dragP.y)*K;
    c.fillStyle='rgba(91,63,168,.45)';
    outer:
    for(let i=0;i<18;i++){
      vx+=windX*.05;vy+=GRAV*.05;px+=vx*.05;py+=vy*.05;
      if(py>GROUND)break;
      for(const o of obs){
        const oy2=oY(o);
        if(px>o.x-6&&px<o.x+o.w+6&&py>oy2-6&&py<oy2+o.h+6)break outer;
      }
      c.beginPath();c.arc(px,py,5-i*.2,0,Math.PI*2);c.fill();
    }
  }
  // iz
  for(const t of trail){
    c.globalAlpha=Math.max(0,.4-t.age);
    c.fillStyle='#FFA75E';
    c.beginPath();c.arc(t.x,t.y,7,0,Math.PI*2);c.fill();
  }
  c.globalAlpha=1;
  // yumak top (kedi suratlı)
  const bx=(state==='drag'&&dragP)?dragP.x:ball.x;
  const by=(state==='drag'&&dragP)?dragP.y:ball.y;
  if(state!=='done'){
    c.fillStyle='#FFA75E';
    c.beginPath();c.arc(bx,by,BALL_R,0,Math.PI*2);c.fill();
    c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=2.5;
    c.beginPath();c.arc(bx,by,BALL_R*.6,-.5,2);c.stroke();
    c.beginPath();c.arc(bx,by,BALL_R*.85,2.4,4.5);c.stroke();
    c.fillStyle='#2E2440';
    c.beginPath();c.arc(bx-7,by-3,3,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(bx+7,by-3,3,0,Math.PI*2);c.fill();
    c.fillStyle='#FF6B9D';
    c.beginPath();c.arc(bx,by+4,3,0,Math.PI*2);c.fill();
  }
  // HUD
  c.textAlign='left';c.font='26px sans-serif';
  if(rainMode){
    c.fillText('🧶∞',20,44);
    c.textAlign='center';c.fillStyle=rainT<10?'#E85D75':'#5B3FA8';c.font='bold 34px Fredoka, sans-serif';
    c.fillText('⏱ '+Math.max(0,Math.ceil(rainT)),SW/2,112);
    c.textAlign='right';c.fillStyle='#5B3FA8';c.font='bold 24px Fredoka, sans-serif';
    c.fillText('🎈 '+rainScore+'   🏆 '+(save.rainBest||0),SW-22,44);
  }else{
    let hud='';for(let i=0;i<shots;i++)hud+='🧶';
    c.fillText(hud,20,44);
    c.textAlign='right';c.fillStyle='#5B3FA8';c.font='bold 24px Fredoka, sans-serif';
    c.fillText('🎈 '+balloons.filter(b=>!b.popped).length,SW-22,44);
  }
  // bölüm düğmeleri (+ sonsuz mod düğmesi)
  for(const B of LVLBTN){
    const isRainBtn=B.i===NLVL;
    const locked=isRainBtn?!save.won[NLVL]:B.i+1>save.unlocked;
    const sel=isRainBtn?rainMode:(!rainMode&&B.i+1===lvl);
    c.fillStyle='rgba(91,63,168,.18)';
    rrS(c,B.x,B.y+5,B.w,B.h,18);c.fill();
    c.fillStyle=locked?'#E4E0D8':sel?'#FFD75E':(isRainBtn?'#D6F3FF':'#FFFFFF');
    rrS(c,B.x,B.y,B.w,B.h,18);c.fill();
    c.textAlign='center';c.fillStyle=locked?'rgba(91,63,168,.4)':'#5B3FA8';
    if(isRainBtn){
      c.font='bold 24px Fredoka, sans-serif';
      c.fillText(locked?'🔒':'🎈∞',B.x+B.w/2,B.y+38);
    }else{
      c.font='bold 24px Fredoka, sans-serif';
      c.fillText(locked?'🔒':String(B.i+1),B.x+B.w/2,B.y+32);
      const st=(save.stars||{})[B.i+1]||0;
      if(!locked&&st){
        c.font='13px sans-serif';
        c.fillText('⭐'.repeat(st),B.x+B.w/2,B.y+51);
      }
    }
  }
  c.textAlign='left';
}
function rrS(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}
/* ---- Ölçek ve giriş ---- */
function scaleToFit(){
  const w=swrap.clientWidth,h=swrap.clientHeight;
  if(!w||!h)return;
  scontainer.style.transform='translate(-50%,-50%) scale('+Math.min(w/SW,h/SH)+')';
}
function toC(clientX,clientY){
  const r=scontainer.getBoundingClientRect();
  return{x:(clientX-r.left)/r.width*SW,y:(clientY-r.top)/r.height*SH};
}
function onDown(clientX,clientY){
  if(!active)return;
  audio();
  const p=toC(clientX,clientY);
  for(const B of LVLBTN){
    if(p.x>=B.x&&p.x<=B.x+B.w&&p.y>=B.y&&p.y<=B.y+B.h){
      if(B.i===NLVL){
        if(!save.won[NLVL]){sfx.nope();say('Balon yağmuru için önce bütün bölümleri bitirmelisin Ada!');}
        else loadRain();
      }else if(B.i+1>save.unlocked){sfx.nope();say('Bu bölüm daha kilitli Ada!');}
      else loadLevel(B.i+1);
      return;
    }
  }
  if(state==='aim'&&Math.hypot(p.x-ball.x,p.y-ball.y)<95){state='drag';dragP=clampDrag(p);}
}
function clampDrag(p){
  let dx=p.x-ANCHOR.x,dy=p.y-ANCHOR.y;
  const d=Math.hypot(dx,dy);
  if(d>MAXDRAG){dx=dx/d*MAXDRAG;dy=dy/d*MAXDRAG;}
  return{x:ANCHOR.x+dx,y:ANCHOR.y+dy};
}
function onMove(clientX,clientY){
  if(state!=='drag')return;
  dragP=clampDrag(toC(clientX,clientY));
}
function onUp(){
  if(state!=='drag')return;
  launch(dragP);
}
swrap.addEventListener('touchstart',e=>{const t=e.changedTouches[0];onDown(t.clientX,t.clientY);e.preventDefault();},{passive:false});
swrap.addEventListener('touchmove',e=>{const t=e.changedTouches[0];onMove(t.clientX,t.clientY);e.preventDefault();},{passive:false});
swrap.addEventListener('touchend',e=>{onUp();e.preventDefault();},{passive:false});
swrap.addEventListener('mousedown',e=>onDown(e.clientX,e.clientY));
swrap.addEventListener('mousemove',e=>onMove(e.clientX,e.clientY));
swrap.addEventListener('mouseup',onUp);

function loop(ts){
  if(!active)return;
  const dt=Math.min((ts-lastTs)/1000,.05);lastTs=ts;
  update(dt);draw();
  raf=requestAnimationFrame(loop);
}
return{
  enter(){
    try{Object.assign(save,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch{}
    active=true;lastTs=performance.now();
    requestAnimationFrame(()=>scaleToFit());
    loadLevel(Math.min(save.unlocked,NLVL));
    raf=requestAnimationFrame(loop);
    say('Ada, Pati Sapanına hoş geldin! Turuncu yumağa dokun, geriye doğru çek ve bırak. Balonları patlatmaya çalış!');
  },
  exit(){active=false;rainMode=false;if(raf)cancelAnimationFrame(raf);},
  onResize(){if(active)scaleToFit();}
};

function key(c,r){return r*cols+c;}
function isWall(c,r){

function loadLevel(n){

  map.forEach((line,r)=>{

      row.push(0);
      if(ch==='G'){gSpawns.push({c,r});continue;}
      if(ch==='P'){pSpawn={c,r};continue;}
      if(ch==='o')powers.add(key(c,r));
      else if(ch==='.')dots.add(key(c,r));
    }
    grid.push(row);

function atCenter(e){

  return Math.abs(e.x-(cell.c*cs+cs/2))<2.2&&Math.abs(e.y-(cell.r*cs+cs/2))<2.2;
}
function openDirs(c,r,banDir){
  const out=[];

    if(banDir&&d===banDir)continue;
    if(!isWall(c+DIRS[d].x,r+DIRS[d].y))out.push(d);
  }

}
function stepEnt(e,speed,dt){
  if(!e.dir)return;
  const v=DIRS[e.dir];
  e.x+=v.x*speed*dt;e.y+=v.y*speed*dt;
  // tünel sarması
  if(e.x<-cs/2)e.x+=cols*cs;
  if(e.x>cols*cs+cs/2)e.x-=cols*cs;
  // eksene hizala
  if(v.x!==0){const r=cellOf(e).r;e.y+=((r*cs+cs/2)-e.y)*Math.min(1,dt*12);}
  else{const c=cellOf(e).c;e.x+=((c*cs+cs/2)-e.x)*Math.min(1,dt*12);}
}

    return;
  }
  if(state==='caught'){
    stateT+=dt;
    if(stateT>1.6){
      if(lives<=0){
        setState('fail');
        say('Olsun Ada! Hayaletler bu sefer çok hızlıydı. Aynı bölümü bir daha deneyelim!');
        setTimeout(()=>{if(active)loadLevel(lvl);},3400);
      }else{
        resetPositions();shieldT=2.5;setState('ready');
      }
    }
    return;
  }
  if(state!=='play')return;
  if(shieldT>0)shieldT-=dt;
  if(frightT>0){
    frightT-=dt;
    if(frightT<=0)ghosts.forEach(g=>{if(g.mode==='fright')g.mode='chase';});
  }
  /* oyuncu */
  const pcell=cellOf(player);
  if(atCenter(player)){
    if(player.queued&&!isWall(pcell.c+DIRS[player.queued].x,pcell.r+DIRS[player.queued].y)){
      player.dir=player.queued;player.queued=null;
    }
    if(player.dir&&isWall(pcell.c+DIRS[player.dir].x,pcell.r+DIRS[player.dir].y))player.dir=null;
  }
  stepEnt(player,PSPEED,dt);
  /* yem yeme */
  const pk=key((pcell.c+cols)%cols,pcell.r);
  if(dots.has(pk)){
    dots.delete(pk);score+=10;
    tone(dots.size%2?520:660,.06,'square',.12);
  }
  if(powers.has(pk)){
    powers.delete(pk);score+=50;
    sfx.yay();
    frightT=PLVL[lvl-1].fright;
    ghosts.forEach(g=>{if(g.mode!=='eyes')g.mode='fright';});
    say('Şimdi sen kovala Ada!');
  }
  if(dots.size===0&&powers.size===0){levelClear();return;}
  /* hayaletler */
  const L=PLVL[lvl-1];
  for(const g of ghosts){
    const gc=cellOf(g);
    if(g.mode==='eyes'){
      // yuvaya dön
      if(gc.c===g.spawn.c&&gc.r===g.spawn.r&&atCenter(g)){g.mode='chase';g.dir='left';}
    }
    if(atCenter(g)){
      const options=openDirs(gc.c,gc.r,g.dir?OPP[g.dir]:null);
      const opts=options.length?options:openDirs(gc.c,gc.r,null);
      let target;
      if(g.mode==='eyes')target={x:g.spawn.c*cs+cs/2,y:g.spawn.r*cs+cs/2};
      else target={x:player.x,y:player.y};
      let best=opts[0];
      if(g.mode!=='eyes'&&Math.random()<L.rnd){
        best=opts[(Math.random()*opts.length)|0];
      }else{
        let bestD=g.mode==='fright'?-1:1e9;
        for(const d of opts){
          const nx=(gc.c+DIRS[d].x)*cs+cs/2,ny=(gc.r+DIRS[d].y)*cs+cs/2;
          const dist=Math.hypot(nx-target.x,ny-target.y);
          if(g.mode==='fright'?dist>bestD:dist<bestD){bestD=dist;best=d;}
        }
      }
      g.dir=best;
    }
    stepEnt(g,g.mode==='eyes'?EYESPEED:(g.mode==='fright'?FSPEED:L.gSpeed),dt);
    /* çarpışma */
    if(Math.hypot(g.x-player.x,g.y-player.y)<cs*.72){
      if(g.mode==='fright'){
        g.mode='eyes';score+=200;
        sfx.pop();confettiBurst(12);
        say('Yakaladın!');
      }else if(g.mode==='chase'&&shieldT<=0){
        lives--;
        msfxCaught();
        setState('caught');
        say(lives>0?'Ah! Yakalandın Ada! Ama hâlâ '+lives+' canın var, devam!':'');
        return;
      }
    }
  }
}

function levelClear(){

/* ---- çizim ---- */
function draw(){
  pc.fillStyle='#2A2350';pc.fillRect(0,0,PW,PH);
  /* HUD */
  pc.textAlign='left';pc.font='30px sans-serif';
  let h='';for(let i=0;i<lives;i++)h+='❤️';
  pc.fillText(h,24,52);
  pc.textAlign='center';pc.fillStyle='#FFD75E';pc.font='bold 30px Fredoka, sans-serif';
  pc.fillText('Bölüm '+lvl,PW/2,52);
  pc.textAlign='right';
  pc.fillText('🐟 '+score,PW-24,52);
  pc.save();pc.translate(offX,offY);
  /* duvarlar */
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(grid[r][c]!==1)continue;
    pc.fillStyle='#4D3FA3';
    const x=c*cs+3,y=r*cs+3,s=cs-6;
    pc.beginPath();
    pc.moveTo(x+7,y);pc.arcTo(x+s,y,x+s,y+s,7);pc.arcTo(x+s,y+s,x,y+s,7);
    pc.arcTo(x,y+s,x,y,7);pc.arcTo(x,y,x+s,y,7);pc.closePath();pc.fill();
  }
  /* yemler */
  pc.fillStyle='#FFE9A8';
  dots.forEach(k=>{
    const c=k%cols,r=(k/cols)|0;
    pc.beginPath();pc.arc(c*cs+cs/2,r*cs+cs/2,3.5,0,Math.PI*2);pc.fill();
  });
  /* süt şişeleri (güç) */
  powers.forEach(k=>{
    const c=k%cols,r=(k/cols)|0;
    const x=c*cs+cs/2,y=r*cs+cs/2,pulse=1+Math.sin(tG*5)*.15;
    pc.fillStyle='#FFFFFF';
    pc.beginPath();pc.arc(x,y,7*pulse,0,Math.PI*2);pc.fill();
    pc.fillStyle='#AEE7FF';
    pc.beginPath();pc.arc(x,y-1,3*pulse,0,Math.PI*2);pc.fill();
  });
  /* hayaletler */
  for(const g of ghosts)drawGhost(g);
  /* Pamuk */
  drawKitten(player);
  pc.restore();
  /* durum yazıları */
  if(state==='ready'){
    pc.textAlign='center';pc.fillStyle='#FFD75E';pc.font='bold 54px Fredoka, sans-serif';
    pc.fillText('HAZIR?',PW/2,PH/2);
  }
  if(frightT>0&&state==='play'){
    pc.textAlign='center';pc.fillStyle='#7FE8C3';pc.font='bold 26px Fredoka, sans-serif';
    pc.fillText('KOVALA! '+Math.ceil(frightT),PW/2,PH-26);
  }
  pc.textAlign='left';
}
function drawKitten(e){
  const r=cs*.44;
  const blink=shieldT>0&&Math.sin(tG*14)>0;
  if(blink)return;
  const ang={right:0,down:Math.PI/2,left:Math.PI,up:-Math.PI/2}[e.dir||'right']||0;
  const mouth=e.dir?(Math.abs(Math.sin(tG*9))*.55+.08):.25;
  pc.save();pc.translate(e.x,e.y);pc.rotate(ang);
  // kulaklar
  pc.fillStyle='#FFA75E';
  pc.beginPath();pc.moveTo(-r*.15,-r*.75);pc.lineTo(-r*.65,-r*1.35);pc.lineTo(-r*.85,-r*.45);pc.closePath();pc.fill();
  pc.beginPath();pc.moveTo(-r*.15,r*.75);pc.lineTo(-r*.65,r*1.35);pc.lineTo(-r*.85,r*.45);pc.closePath();pc.fill();
  // gövde (ağızlı)
  pc.beginPath();pc.moveTo(0,0);
  pc.arc(0,0,r,mouth,Math.PI*2-mouth);
  pc.closePath();pc.fill();
  // göz
  pc.fillStyle='#2E2440';
  pc.beginPath();pc.arc(-r*.05,-r*.45,r*.16,0,Math.PI*2);pc.fill();
  pc.restore();
}
function drawGhost(g){
  const r=cs*.42;
  const frightened=g.mode==='fright';
  const blinking=frightened&&frightT<2&&Math.sin(tG*12)>0;
  pc.save();pc.translate(g.x,g.y);
  if(g.mode!=='eyes'){
    pc.fillStyle=frightened?(blinking?'#FFFFFF':'#5C6BC0'):g.color;
    pc.beginPath();
    pc.arc(0,-r*.15,r,Math.PI,0);
    const w=r/3;
    pc.lineTo(r,r*.75);
    for(let i=0;i<3;i++){
      pc.lineTo(r-w*(2*i+1),r*.5);
      pc.lineTo(r-w*(2*i+2),r*.75);
    }
    pc.closePath();pc.fill();
  }
  // gözler
  const v=DIRS[g.dir||'left']||{x:0,y:0};
  for(const s of [-1,1]){
    pc.fillStyle='#FFFFFF';
    pc.beginPath();pc.arc(s*r*.38,-r*.25,r*.26,0,Math.PI*2);pc.fill();
    pc.fillStyle='#2E2440';
    pc.beginPath();pc.arc(s*r*.38+v.x*r*.11,-r*.25+v.y*r*.11,r*.13,0,Math.PI*2);pc.fill();
  }
  if(frightened&&!blinking){
    pc.strokeStyle='#FFFFFF';pc.lineWidth=2.5;
    pc.beginPath();
    for(let i=0;i<=6;i++)pc.lineTo(-r*.5+i*r/6,r*.25+((i%2)?4:-4)*.8);
    pc.stroke();
  }
  pc.restore();
}

/* ================= BOYAMA TAHTASI (serbest + kelime avı) ================= */
const Paint=(()=>{
'use strict';
const W=1000,H=700;
const COLORS=['#E8443A','#FF8FB1','#FFA75E','#FFD75E','#7FE8C3','#3FA86B','#7ECFFF','#4D6FE8','#B085F5','#8B5A38','#2E2440'];
const WORDS=[['TAVŞAN','🐇'],['KEDİ','🐱'],['KÖPEK','🐶'],['BALIK','🐟'],['KUŞ','🐦'],['ASLAN','🦁'],['FİL','🐘'],['ARI','🐝'],['AYI','🐻'],['İNEK','🐮'],['ÖRDEK','🦆'],['AT','🐴'],['KOYUN','🐑'],['PANDA','🐼']];
const FONT='bold 165px Fredoka, sans-serif';

const wrap=document.getElementById('pwrap2');
const container=document.getElementById('pcontainer2');
const cv=document.getElementById('paintcv');
const ctx=cv.getContext('2d');
// iPad Safari büyük emoji düzeltmesi (hayvan resmi için)
const aniCv=document.createElement('canvas');aniCv.width=100;aniCv.height=100;
const aniCtx=aniCv.getContext('2d');
function bigEmoji(c,e,x,y,size){
  aniCtx.clearRect(0,0,100,100);
  aniCtx.font='74px sans-serif';aniCtx.textAlign='center';aniCtx.textBaseline='middle';
  aniCtx.fillText(e,50,52);
  c.drawImage(aniCv,0,0,100,100,x-size/2,y-size/2,size,size);
}
// boya katmanı
const paintCv=document.createElement('canvas');paintCv.width=W;paintCv.height=H;
const pctx=paintCv.getContext('2d');
// harf maskesi
const maskCv=document.createElement('canvas');maskCv.width=W;maskCv.height=H;
const mctx=maskCv.getContext('2d');

let active=false,raf=null;
let mode='free'; // free | word
let color=COLORS[0],erasing=false,brush=22;
let wordIdx=-1,word='',emoji='',letters=[]; // {ch,x,w,y,scale,pts,done,color}
let wordDone=false,tG=0;

/* ---- kelime kurulumu ---- */
function pickWord(){
  wordIdx=(wordIdx+1)%WORDS.length;
  [word,emoji]=WORDS[wordIdx];
  buildWord();
  say('Yeni kelime! Resme bak ve kesik çizgili harflerin üzerinden parmağınla boya Ada!');
}
function buildWord(){
  wordDone=false;
  pctx.clearRect(0,0,W,H);
  mctx.clearRect(0,0,W,H);
  mctx.textBaseline='middle';
  mctx.font=FONT;
  const gap=14;
  const widths=[...word].map(ch=>mctx.measureText(ch).width);
  const total=widths.reduce((a,b)=>a+b,0)+gap*(word.length-1);
  const scale=Math.min(1,(W-80)/total);
  let x=(W-total*scale)/2;
  const y=440;
  letters=[];
  [...word].forEach((ch,i)=>{
    const w=widths[i]*scale;
    mctx.font='bold '+(165*scale)+'px Fredoka, sans-serif';
    mctx.fillStyle='#fff';
    mctx.fillText(ch,x,y);
    letters.push({ch,x,w,y,scale,done:false,color:COLORS[(i+1)%COLORS.length],pts:[]});
    x+=w+gap*scale;
  });
  // kapsama örnek noktaları: maske pikselleri taranır
  const img=mctx.getImageData(0,0,W,H).data;
  const stride=7;
  for(let py=300;py<580;py+=stride){
    for(let px=20;px<W-20;px+=stride){
      if(img[(py*W+px)*4+3]>120){
        const L=letters.find(l=>px>=l.x-4&&px<=l.x+l.w+4);
        if(L)L.pts.push({x:px,y:py,hit:false});
      }
    }
  }
}
function letterProgress(L){
  if(!L.pts.length)return 1;
  return L.pts.filter(p=>p.hit).length/L.pts.length;
}
/* ---- çizim döngüsü ---- */
function draw(){
  tG+=1/60;
  if(mode==='free'){
    ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#EBE3F7';ctx.lineWidth=8;ctx.strokeRect(4,4,W-8,H-8);
    ctx.drawImage(paintCv,0,0);
  }else{
    ctx.fillStyle='#FFF8EC';ctx.fillRect(0,0,W,H);
    bigEmoji(ctx,emoji,W/2,150,150);
    ctx.textAlign='left';ctx.textBaseline='middle';
    letters.forEach(L=>{
      ctx.font='bold '+(165*L.scale)+'px Fredoka, sans-serif';
      if(L.done){
        ctx.fillStyle=L.color;
        ctx.fillText(L.ch,L.x,L.y);
      }else{
        ctx.strokeStyle='#B9AEDC';ctx.lineWidth=3;
        ctx.setLineDash([12,10]);
        ctx.strokeText(L.ch,L.x,L.y);
        ctx.setLineDash([]);
      }
    });
    ctx.drawImage(paintCv,0,0);
    ctx.textAlign='center';
    if(wordDone){
      ctx.fillStyle='#3FA86B';ctx.font='bold 44px Fredoka, sans-serif';
      ctx.fillText('⭐ '+word.toLocaleLowerCase('tr')+'! ⭐',W/2,635);
    }else{
      ctx.fillStyle='rgba(91,63,168,.5)';ctx.font='22px Fredoka, sans-serif';
      ctx.fillText('Kesik çizgili harflerin üzerinden boya!',W/2,650);
    }
    ctx.textAlign='left';
  }
  if(active)raf=requestAnimationFrame(draw);
}
/* ---- boyama ---- */
function toC(clientX,clientY){
  const r=container.getBoundingClientRect();
  return{x:(clientX-r.left)/r.width*W,y:(clientY-r.top)/r.height*H};
}
let last=null;
function strokeTo(p){
  pctx.lineCap='round';pctx.lineJoin='round';
  pctx.lineWidth=erasing?brush*2.2:brush;
  pctx.globalCompositeOperation=erasing?'destination-out':'source-over';
  pctx.strokeStyle=color;
  pctx.beginPath();
  pctx.moveTo(last.x,last.y);pctx.lineTo(p.x,p.y);
  pctx.stroke();
  pctx.globalCompositeOperation='source-over';
  if(mode==='word'){
    // boya yalnızca harflerin içinde kalsın
    pctx.globalCompositeOperation='destination-in';
    pctx.drawImage(maskCv,0,0);
    pctx.globalCompositeOperation='source-over';
    if(!erasing)coverSegment(last,p);
  }
  last=p;
}
function coverSegment(a,b){
  const r=brush/2+9;
  const abx=b.x-a.x,aby=b.y-a.y;
  const len2=abx*abx+aby*aby||1;
  letters.forEach(L=>{
    if(L.done)return;
    if(Math.max(a.x,b.x)<L.x-r||Math.min(a.x,b.x)>L.x+L.w+r)return;
    L.pts.forEach(pt=>{
      if(pt.hit)return;
      let t=((pt.x-a.x)*abx+(pt.y-a.y)*aby)/len2;
      t=Math.max(0,Math.min(1,t));
      const dx=pt.x-(a.x+abx*t),dy=pt.y-(a.y+aby*t);
      if(dx*dx+dy*dy<r*r)pt.hit=true;
    });
    if(letterProgress(L)>=0.55){
      L.done=true;
      sfx.pop();
      say(LETTER_NAMES[L.ch]||L.ch);
      checkWordDone();
    }
  });
}
function checkWordDone(){
  if(wordDone||!letters.every(L=>L.done))return;
  wordDone=true;
  sfx.fanfare();confettiBurst(45);
  const w=word.toLocaleLowerCase('tr');
  setTimeout(()=>say(w+'! Aferin Ada, kelimeyi tamamladın!'),700);
  setTimeout(()=>{if(active&&mode==='word'&&wordDone)pickWord();},5200);
}

/* ---- kurulum ---- */
function loadSeries(i,newScene){
  sIdx=i;
  const S=SERIES[i];
  [gc,gr]=S.grid;
  pw=IMG_W/gc;ph=IMG_H/gr;
  timeLeft=S.time;state='play';drag=null;
  // sahne seç (seri içinde sırayla değişir)
  save.scene[i]=((save.scene[i]??-1)+(newScene?1:0))%SCENES.length;
  if(save.scene[i]<0)save.scene[i]=0;
  const scn=SCENES[save.scene[i]];
  sceneName=scn.name;
  sc.clearRect(0,0,IMG_W,IMG_H);
  scn.draw(sc);
  store();
  // parçalar + tepsi düzeni
  pieces=[];
  const n=S.n,perRow=Math.ceil(n/2);
  const zScale=Math.min((ZW-70)/(perRow*pw+(perRow-1)*16),300/(2*ph+20),0.6);
  const tw=pw*zScale,th=ph*zScale;
  const rowW=perRow*tw+(perRow-1)*16;
  const tx0=(ZW-rowW)/2,ty0=680;
  const order=[];
  for(let gy=0;gy<gr;gy++)for(let gx=0;gx<gc;gx++)order.push({gx,gy});
  shuffle(order);
  order.forEach((o,k)=>{
    const row=(k/perRow)|0,col=k%perRow;
    const hx=tx0+col*(tw+16),hy=ty0+row*(th+18);
    pieces.push({gx:o.gx,gy:o.gy,homeX:hx,homeY:hy,x:hx,y:hy,scale:zScale,placed:false});
  });
  say(S.n+' parçalı ünikorn yapbozu! Resmin adı: '+sceneName+'. Alttaki parçaları tut ve resimdeki yerine sürükle Ada!');
}
/* ---- güncelleme + çizim ---- */
function update(dt){
  tG+=dt;
  if(state==='play'){
    timeLeft-=dt;
    if(timeLeft<=0){
      timeLeft=0;state='fail';
      say('Süre bitti Ada! Olsun, yeni bir resimle tekrar deneyelim!');
      setTimeout(()=>{if(active)loadSeries(sIdx,true);},3600);
    }
  }
}
function draw(){
  const c=zc;
  const g=c.createLinearGradient(0,0,0,ZH);
  g.addColorStop(0,'#FCEBFF');g.addColorStop(1,'#E3F6FF');
  c.fillStyle=g;c.fillRect(0,0,ZW,ZH);
  /* seri düğmeleri */
  for(const B of ZBTN){
    const locked=B.i+1>save.unlocked,sel=B.i===sIdx;
    c.fillStyle='rgba(91,63,168,.18)';rrZ(c,B.x,B.y+5,B.w,B.h,18);c.fill();
    c.fillStyle=locked?'#E4E0D8':sel?'#FFD75E':'#FFFFFF';rrZ(c,B.x,B.y,B.w,B.h,18);c.fill();
    c.textAlign='center';c.fillStyle=locked?'rgba(91,63,168,.4)':'#5B3FA8';
    c.font='bold 24px Fredoka, sans-serif';
    c.fillText(locked?'🔒':SERIES[B.i].label+' parça',B.x+B.w/2,B.y+30);
    const st=(save.stars||{})[B.i]||0;
    if(!locked&&st){c.font='13px sans-serif';c.fillText('⭐'.repeat(st),B.x+B.w/2,B.y+52);}
  }
  /* süre çubuğu */
  const S=SERIES[sIdx],frac=Math.max(0,timeLeft/S.time);
  c.fillStyle='rgba(91,63,168,.15)';rrZ(c,80,96,ZW-160,26,13);c.fill();
  c.fillStyle=frac>.35?'#7FE8C3':'#FF8FB1';
  if(frac>0){rrZ(c,80,96,(ZW-160)*frac,26,13);c.fill();}
  c.textAlign='center';c.fillStyle='#5B3FA8';c.font='bold 20px Fredoka, sans-serif';
  c.fillText('⏱ '+Math.ceil(timeLeft)+'   —   '+sceneName+' 🦄',ZW/2,88);
  /* pano: hayalet resim + ızgara */
  c.save();
  c.globalAlpha=1;
  c.fillStyle='#fff';rrZ(c,BX-8,BY-8,IMG_W+16,IMG_H+16,16);c.fill();
  c.globalAlpha=.18;
  c.drawImage(sceneCv,BX,BY);
  c.globalAlpha=1;
  c.strokeStyle='rgba(91,63,168,.3)';c.lineWidth=2;
  for(let i=1;i<gc;i++){c.beginPath();c.moveTo(BX+i*pw,BY);c.lineTo(BX+i*pw,BY+IMG_H);c.stroke();}
  for(let i=1;i<gr;i++){c.beginPath();c.moveTo(BX,BY+i*ph);c.lineTo(BX+IMG_W,BY+i*ph);c.stroke();}
  c.restore();
  /* yerleşen parçalar */
  for(const p of pieces){
    if(!p.placed)continue;
    c.drawImage(sceneCv,p.gx*pw,p.gy*ph,pw,ph,BX+p.gx*pw,BY+p.gy*ph,pw,ph);
  }
  c.strokeStyle='rgba(91,63,168,.25)';c.lineWidth=2;c.strokeRect(BX,BY,IMG_W,IMG_H);
  /* tepsi parçaları */
  for(const p of pieces){
    if(p.placed||p===drag?.p)continue;
    drawPiece(p,p.x,p.y,p.scale);
  }
  if(drag)drawPiece(drag.p,drag.p.x,drag.p.y,1);
  /* bitiş */
  if(state==='done'){
    c.fillStyle='rgba(255,248,236,.55)';c.fillRect(0,0,ZW,ZH);
    c.textAlign='center';c.fillStyle='#3FA86B';c.font='bold 54px Fredoka, sans-serif';
    c.fillText('🦄 Harikasın Ada! 🦄',ZW/2,ZH*.5);
  }
  c.textAlign='left';
}
function drawPiece(p,x,y,s){
  const c=zc,w=pw*s,h=ph*s;
  c.fillStyle='rgba(91,63,168,.25)';rrZ(c,x+3,y+5,w,h,8);c.fill();
  c.drawImage(sceneCv,p.gx*pw,p.gy*ph,pw,ph,x,y,w,h);
  c.strokeStyle='#fff';c.lineWidth=3;c.strokeRect(x,y,w,h);
}
function rrZ(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}
/* ---- tamamlanma ---- */
function checkDone(){
  if(!pieces.every(p=>p.placed))return;
  state='done';
  sfx.fanfare();confettiBurst(60);
  const S=SERIES[sIdx],frac=timeLeft/S.time;
  const st=frac>.5?3:frac>.25?2:1;
  save.stars[sIdx]=Math.max(save.stars[sIdx]||0,st);
  save.unlocked=Math.min(4,Math.max(save.unlocked,sIdx+2));
  store();
  const msg=st===3?'Üç yıldız, süper hızlısın!':st===2?'İki yıldız!':'Bir yıldız!';
  if(sIdx<3){
    say('Yaşasın Ada! '+sceneName+' resmini tamamladın! '+msg+' Şimdi '+SERIES[sIdx+1].n+' parçalı yapboza geçiyoruz!');
    setTimeout(()=>{if(active)loadSeries(sIdx+1,false);},5000);
  }else{
    say('Yaşasın Ada! '+msg);
    setTimeout(()=>{
      win('🦄🏆','Bütün unicorn yapbozlarını bitirdin!','İnanılmaz Ada! Yapboz ustası oldun! Ünikornlar seni çok seviyor!');
    },1200);
  }
}
/* ---- girişler ---- */
function toC(cx,cy){
  const r=zcontainer.getBoundingClientRect();
  return{x:(cx-r.left)/r.width*ZW,y:(cy-r.top)/r.height*ZH};
}
function onDown(cx,cy){
  if(!active)return;
  audio();
  const p2=toC(cx,cy);
  for(const B of ZBTN){
    if(p2.x>=B.x&&p2.x<=B.x+B.w&&p2.y>=B.y&&p2.y<=B.y+B.h){
      if(B.i+1>save.unlocked){sfx.nope();say('Bu seri daha kilitli Ada! Önce öncekini bitir!');}
      else loadSeries(B.i,B.i===sIdx);
      return;
    }
  }
  if(state!=='play')return;
  for(let i=pieces.length-1;i>=0;i--){
    const p=pieces[i];
    if(p.placed)continue;
    const w=pw*p.scale,h=ph*p.scale;
    if(p2.x>=p.x-10&&p2.x<=p.x+w+10&&p2.y>=p.y-10&&p2.y<=p.y+h+10){
      drag={p,offx:pw/2,offy:ph/2};
      p.x=p2.x-pw/2;p.y=p2.y-ph/2;
      tone(600,.05,'sine',.12);
      return;
    }
  }
}
function onMove(cx,cy){
  if(!drag)return;
  const p2=toC(cx,cy);
  drag.p.x=p2.x-drag.offx;drag.p.y=p2.y-drag.offy;
}
function onUp(){
  if(!drag)return;
  const p=drag.p;drag=null;
  const tx=BX+p.gx*pw,ty=BY+p.gy*ph;
  const cx=p.x+pw/2,cy=p.y+ph/2;
  if(Math.hypot(cx-(tx+pw/2),cy-(ty+ph/2))<Math.min(pw,ph)*.55){
    p.placed=true;
    sfx.pop();confettiBurst(8);
    const left=pieces.filter(q=>!q.placed).length;
    if(left>0&&left%3===0)say('Yerine oturdu! '+left+' parça kaldı!');
    checkDone();
  }else{
    p.x=p.homeX;p.y=p.homeY;
    sfx.nope();
  }
}
zwrap.addEventListener('touchstart',e=>{const t=e.changedTouches[0];onDown(t.clientX,t.clientY);e.preventDefault();},{passive:false});
zwrap.addEventListener('touchmove',e=>{const t=e.changedTouches[0];onMove(t.clientX,t.clientY);e.preventDefault();},{passive:false});
zwrap.addEventListener('touchend',e=>{onUp();e.preventDefault();},{passive:false});
zwrap.addEventListener('mousedown',e=>onDown(e.clientX,e.clientY));
zwrap.addEventListener('mousemove',e=>{if(e.buttons)onMove(e.clientX,e.clientY);});
zwrap.addEventListener('mouseup',onUp);

function scaleToFit(){
  const w=zwrap.clientWidth,h=zwrap.clientHeight;
  if(!w||!h)return;
  zcontainer.style.transform='translate(-50%,-50%) scale('+Math.min(w/ZW,h/ZH)+')';
}
function loop(ts){
  if(!active)return;
  const dt=Math.min((ts-lastTs)/1000,.05);lastTs=ts;
  update(dt);draw();
  raf=requestAnimationFrame(loop);
}
return{
  enter(){
    try{Object.assign(save,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch{}
    active=true;lastTs=performance.now();
    requestAnimationFrame(()=>scaleToFit());
    loadSeries(Math.min(save.unlocked,4)-1,true);
    raf=requestAnimationFrame(loop);
  },
  exit(){active=false;drag=null;if(raf)cancelAnimationFrame(raf);},
  onResize(){if(active)scaleToFit();}
};
})();

  rows.forEach((line,r)=>{

    for(let c=0;c<cols;c++){

      if(ch==='#'){row.push(1);continue;}
      row.push(0);
      if(ch==='H')hS.push({c,r});
      if(ch==='S')sS.push({c,r});
      if(ch==='C')fish.push({c,r});
    }
    grid.push(row);
  });
  return {grid,cols,rows:rows.length,hS,sS,fishCells:fish};
}
